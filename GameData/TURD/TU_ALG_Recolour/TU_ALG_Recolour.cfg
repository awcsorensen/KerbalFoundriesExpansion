@PART[KF-ALG-Medium|KF-ALG-Small|KF-ALG-SmallSide]:NEEDS[TexturesUnlimited&KerbalFoundries&TURD]:AFTER[KerbalFoundries]
{
	%MODULE[KSPTextureSwitch],0
	{
		textureSet = ALG-Small-Paint
	}
	%MODULE[SSTURecolorGUI]
	{
		%name = SSTURecolorGUI
	}
}

+KSP_TEXTURE_SET[MWNN_Stock_Paint]
{
	@name = ALG-Small-Paint
	@MATERIAL
	{	
		vector = _DiffuseNorm,0.74,0.74,0.64
		vector = _MetalNorm,0.5,0.5,0.28
		vector = _SmoothnessNorm,0.5,0.5,0.28
	
		texture = _MainTex, KerbalFoundries/Assets/ALG-Small-DIFF
		texture = _Emissive, TURD/TU_ALG_Recolour/ALG-Small-EMIS
		texture = _BumpMap, TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _MetallicGlossMap, TURD/TU_ALG_Recolour/ALG-Small-EMIS
		texture = _AOMap, TURD/TU_Standardised_Switching/000_PlaceholderTextures/Occ
		texture = _MaskTex, TURD/TU_ALG_Recolour/ALG-Small-MASK
	}
}

