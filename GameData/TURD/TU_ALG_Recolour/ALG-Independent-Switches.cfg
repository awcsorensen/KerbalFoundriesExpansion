// Install beside TU_ALG_Recolour.cfg. Targets only original KerbalFoundries ALG parts.
// Remove any earlier ALG-Independent-Switches.cfg from KFE/PBR.

+KSP_TEXTURE_SET[KF-GearMedium-PBR]:NEEDS[TexturesUnlimited&KerbalFoundries&TURD]:AFTER[KerbalFoundries]
{
	@name = TURD-ALG-Medium-Hardware-PBR
	@MATERIAL,0
	{
		-excludeMesh = DELETE
		excludeMesh = ALG-Small-Wheel
		excludeMesh = ALG-SmallSide-Wheel
		excludeMesh = ALG-Medium-Wheel
		excludeMesh = ALG-SmallBW-Wheel
	}
}

