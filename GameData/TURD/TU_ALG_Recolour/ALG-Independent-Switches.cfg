KSP_TEXTURE_SET:NEEDS[TexturesUnlimited&KerbalFoundries&TURD]
{
	name = TURD-ALG-Medium-Hardware-GreyScale
	title = GreyScale
	MATERIAL
	{
		shader = TU/Metallic
		excludeMesh = ALG-Small-Wheel
		excludeMesh = ALG-SmallSide-Wheel
		excludeMesh = ALG-Medium-Wheel
		excludeMesh = ALG-SmallBW-Wheel
		texture = _MainTex, KerbalFoundries/Assets/ALG-Small-DIFF
		texture = _BumpMap, TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _MetallicGlossMap, TURD/TU_ALG_Recolour/ALG-Small-EMIS
		texture = _AOMap, TURD/TU_Standardised_Switching/000_PlaceholderTextures/Occ
	}
}

KSP_TEXTURE_SET:NEEDS[TexturesUnlimited&KerbalFoundries&TURD]
{
	name = TURD-ALG-Medium-Wheels-Stock
	title = Stock Rubber
	MATERIAL
	{
		mode = create
		shader = KSP/Specular
		mesh = ALG-Small-Wheel
		mesh = ALG-SmallSide-Wheel
		mesh = ALG-Medium-Wheel
		mesh = ALG-SmallBW-Wheel
		texture = _MainTex, KerbalFoundries/Assets/ALG-Small-DIFF
		PROPERTY
		{
			name = _SpecColor
			color = 0, 0, 0, 1
		}
		PROPERTY
		{
			name = _Shininess
			float = 0.03
		}
	}
}

