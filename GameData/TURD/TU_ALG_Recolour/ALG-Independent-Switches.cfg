		sectionName = Wheels
		currentTextureSet = TURD-ALG-Medium-Wheels-Stock
		textureSet = TURD-ALG-Medium-Wheels-PBR
		textureSet = TURD-ALG-Medium-Wheels-Legacy
		textureSet = TURD-ALG-Medium-Wheels-Stock
		textureSet = TURD-ALG-Medium-Wheels-Paint
	}
}

