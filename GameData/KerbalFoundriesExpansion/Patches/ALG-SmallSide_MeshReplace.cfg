// Replace mesh to increase length of 'dragbracelower' to rectify mesh gap at full negative strut angle adjustment

@PART[KF-ALG-SmallSide]:AFTER[KerbalFoundries]
{
    // Remove the old model/mesh nodes completely
    !MODEL, * {}
    
    // Define the new model path (relative to GameData)
    MODEL
    {
        model = KerbalFoundriesExpansion/Assets/ALG-SmallSide
    }
}