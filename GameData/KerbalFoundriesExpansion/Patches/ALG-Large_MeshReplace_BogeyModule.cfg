// Replace mesh include new wheel bogey structure added in KSPWheel 0.17.0.0 and add module to original cfg for KSPWheelBogey

@PART[KF-ALG-Large]:AFTER[KerbalFoundries]
{
    // Remove the old model/mesh nodes completely
    !MODEL, * {}
    
    // Define the new model path (relative to GameData)
    MODEL
    {
        model = KerbalFoundriesExpansion/Assets/ALG-Large
    }

	// Add wheel bogey module to existing cfg after adjustable gear for GUI ordering purposes
	MODULE,6
	{
		name = KSPWheelBogey
		bogeyName = ALG-Large-WheelBogey
		restingRotation = 25
		userSetBogeyAngle = true
	}
}