// Requires TU_ALG_Recolour/ALG-Independent-Switches.cfg for shared PBR/Legacy sets.

KSP_TEXTURE_SET:NEEDS[TexturesUnlimited&KerbalFoundriesExpansion&TURD]
{
	name = KFE-ALG-Medium-Hardware-GreyScale
	title = GreyScale
	MATERIAL
	{
		shader = TU/Metallic
		excludeMesh = ALG-Small-Wheel
		excludeMesh = ALG-SmallSide-Wheel
		excludeMesh = ALG-Medium-Wheel
		excludeMesh = ALG-SmallBW-Wheel
		texture = _MainTex, KerbalFoundriesExpansion/Assets/ALG-Small-DIFF
		texture = _BumpMap, KerbalFoundriesExpansion/Assets/Bump
		texture = _MetallicGlossMap, KerbalFoundriesExpansion/Assets/ALG-Small-EMIS
		texture = _AOMap, KerbalFoundriesExpansion/Assets/Occ
	}
}

+KSP_TEXTURE_SET[MWNN_Stock_Paint]:NEEDS[TexturesUnlimited&KerbalFoundriesExpansion&TURD]:AFTER[TURD]
{
	@name = KFE-ALG-Medium-Hardware-Paint
	@MATERIAL,0
	{
		excludeMesh = ALG-Small-Wheel
		excludeMesh = ALG-SmallSide-Wheel
		excludeMesh = ALG-Medium-Wheel
		excludeMesh = ALG-SmallBW-Wheel
		vector = _DiffuseNorm,0.74,0.74,0.64
		vector = _MetalNorm,0.5,0.5,0.28
		vector = _SmoothnessNorm,0.5,0.5,0.28
		texture = _MainTex, KerbalFoundriesExpansion/Assets/ALG-Small-DIFF
		texture = _Emissive, KerbalFoundriesExpansion/Assets/ALG-Small-EMIS
		texture = _BumpMap, KerbalFoundriesExpansion/Assets/Bump
		texture = _MetallicGlossMap, KerbalFoundriesExpansion/Assets/ALG-Small-EMIS
		texture = _AOMap, KerbalFoundriesExpansion/Assets/Occ
		texture = _MaskTex, TURD/TU_ALG_Recolour/ALG-Small-MASK
	}
}

KSP_TEXTURE_SET:NEEDS[TexturesUnlimited&KerbalFoundriesExpansion&TURD]
{
	name = KFE-ALG-Medium-Wheels-GreyScale
	title = Stock Rubber
	MATERIAL
	{
		mode = create
		shader = KSP/Specular
		mesh = ALG-Small-Wheel
		mesh = ALG-SmallSide-Wheel
		mesh = ALG-Medium-Wheel
		mesh = ALG-SmallBW-Wheel
		texture = _MainTex, KerbalFoundriesExpansion/Assets/ALG-Small-DIFF
		PROPERTY
		{
			name = _SpecColor
			color = 0, 0, 0, 1
		}
		PROPERTY
		{
			name = _Shininess
			float = 0.03
		}
	}
}

+KSP_TEXTURE_SET[MWNN_Stock_Paint]:NEEDS[TexturesUnlimited&KerbalFoundriesExpansion&TURD]:AFTER[TURD]
{
	@name = KFE-ALG-Medium-Wheels-Paint
	@MATERIAL,0
	{
		mesh = ALG-Small-Wheel
		mesh = ALG-SmallSide-Wheel
		mesh = ALG-Medium-Wheel
		mesh = ALG-SmallBW-Wheel
		vector = _DiffuseNorm,0.74,0.74,0.64
		vector = _MetalNorm,0.5,0.5,0.28
		vector = _SmoothnessNorm,0.5,0.5,0.28
		texture = _MainTex, KerbalFoundriesExpansion/Assets/ALG-Small-DIFF
		texture = _Emissive, KerbalFoundriesExpansion/Assets/ALG-Small-EMIS
		texture = _BumpMap, KerbalFoundriesExpansion/Assets/Bump
		texture = _MetallicGlossMap, KerbalFoundriesExpansion/Assets/ALG-Small-EMIS
		texture = _AOMap, KerbalFoundriesExpansion/Assets/Occ
		texture = _MaskTex, TURD/TU_ALG_Recolour/ALG-Small-MASK
	}
}

@PART[KF-ALG-MediumSide|KF-ALG-MediumSideNH|KF-ALG-MediumNH|KF-ALG-MediumNHBW|KF-ALG-MediumSideNHBW|KF-ALG-MediumTrailingNHRR|KF-ALG-MediumTrailingNH|KF-ALG-MediumSideTrailingNH|KF-ALG-SmallSideNH|KF-ALG-SmallSideNHBW|KF-ALG-SmallNH|KF-ALG-SmallNHBW|KF-ALG-SmallCentreNH|KF-ALG-SmallCentreNHBW|KF-ALG-SmallCentreAsymNH|KF-ALG-SmallCentreSideAsymNH|KF-ALG-SmallCentreAsymNHBW|KF-ALG-SmallCentreSideAsymNHBW|KF-ALG-LinearSmallBW|KF-ALG-LinearSmall|KF-ALG-SmallTrailingNH|KF-ALG-SmallTrailingNHRR|KF-ALG-SmallSideTrailingNH]:NEEDS[TexturesUnlimited&KerbalFoundriesExpansion&TURD]:AFTER[TURD]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Hardware
		currentTextureSet = KFE-ALG-Medium-Hardware-GreyScale
		textureSet = TURD-ALG-Medium-Hardware-PBR
		textureSet = TURD-ALG-Medium-Hardware-Legacy
		textureSet = KFE-ALG-Medium-Hardware-GreyScale
		textureSet = KFE-ALG-Medium-Hardware-Paint
	}
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Wheels
		currentTextureSet = KFE-ALG-Medium-Wheels-GreyScale
		textureSet = TURD-ALG-Medium-Wheels-PBR
		textureSet = TURD-ALG-Medium-Wheels-Legacy
		textureSet = KFE-ALG-Medium-Wheels-GreyScale
		textureSet = KFE-ALG-Medium-Wheels-Paint
	}
	MODULE
	{
		name = SSTURecolorGUI
	}
}
