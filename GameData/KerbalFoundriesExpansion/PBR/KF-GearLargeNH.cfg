@PART[KF-ALG-LargeNH|KF-ALG-LargeSideNH|KF-ALG-ExtraLargeNH|KF-ALG-ExtraLargeSideNH]:FOR[KerbalFoundriesExpansion]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Hardware
		currentTextureSet = KF-GearLarge-PBR
		textureSet = KF-GearLarge-PBR
		textureSet = KF-GearLarge-Legacy
		textureSet = KF-GearLarge-GreyScale		
	}
}
KSP_TEXTURE_SET
{
	name = KF-GearLarge-PBR
	title = PBR
	MATERIAL
	{
		shader = TU/Metallic
		excludeMesh = WheelTread
		texture = _MainTex, KerbalFoundries/Assets/KF-GearLarge-DIFF
		texture = _BumpMap, KerbalFoundries/Assets/KF-GearLarge-NRM
		texture = _MetallicGlossMap, KerbalFoundries/Assets/KF-GearLarge-MET
		texture = _AOMap, KerbalFoundries/Assets/KF-GearLarge-MET
	}
}
KSP_TEXTURE_SET
{
	name = KF-GearLarge-Legacy
	title = Legacy
	MATERIAL
	{
		shader = TU/Legacy
		excludeMesh = WheelTread
		texture = _MainTex, KerbalFoundries/Assets/KF-GearLarge-DIFF
		texture = _BumpMap, KerbalFoundries/Assets/KF-GearLarge-NRM
		texture = _SpecularGlossMap, KerbalFoundries/Assets/KF-GearLarge-MET
		texture = _AOMap, KerbalFoundries/Assets/KF-GearLarge-MET
	}
}
KSP_TEXTURE_SET
{
	name = KF-GearLarge-GreyScale
	title = GreyScale
	MATERIAL
	{
		shader = TU/Metallic
		excludeMesh = WheelTread
		texture = _MainTex, KerbalFoundries/Assets/ALG-Large-DIFF
		texture = _BumpMap, KerbalFoundriesExpansion/Assets/Bump
		texture = _MetallicGlossMap, KerbalFoundriesExpansion/Assets/ALG-Large-EMIS
		texture = _AOMap, KerbalFoundriesExpansion/Assets/Occ
	}
}
@PART[KF-ALG-LargeNH|KF-ALG-LargeSideNH|KF-ALG-ExtraLargeNH|KF-ALG-ExtraLargeSideNH]:NEEDS[TURD]:FOR[KerbalFoundriesExpansion]
{
	@MODULE[KSPTextureSwitch],0
	{
		textureSet = ALG-LargeNH-Paint
	}
	%MODULE[SSTURecolorGUI]
	{
		%name = SSTURecolorGUI
	}
}
+KSP_TEXTURE_SET[MWNN_Stock_Paint]
{
	@name = ALG-LargeNH-Paint
	@MATERIAL
	{			
		vector = _DiffuseNorm,0.74,0.74,0.64
		vector = _MetalNorm,0.5,0.5,0.28
		vector = _SmoothnessNorm,0.5,0.5,0.28
	
		texture = _MainTex, KerbalFoundries/Assets/ALG-Large-DIFF
		texture = _BumpMap, TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _Emissive, TURD/TU_ALG_Recolour/ALG-Large-EMIS
		texture = _AOMap, TURD/TU_Standardised_Switching/000_PlaceholderTextures/Occ
		texture = _MetallicGlossMap, TURD/TU_ALG_Recolour/ALG-Large-EMIS
		texture = _MaskTex, TURD/TU_ALG_Recolour/ALG-LargeNH-MASK
	}
}