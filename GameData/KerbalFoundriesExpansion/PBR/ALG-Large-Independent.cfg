// Requires TU_ALG_Recolour/ALG-Independent-Switches.cfg for shared PBR/Legacy sets.

KSP_TEXTURE_SET:NEEDS[TexturesUnlimited&KerbalFoundriesExpansion&TURD]
{
	name = KFE-ALG-Large-Hardware-GreyScale
	title = GreyScale
	MATERIAL
	{
		shader = TU/Metallic
		excludeMesh = ALG-Large-WheelSet-Front
		excludeMesh = ALG-Large-WheelSet-Middle
		excludeMesh = ALG-Large-WheelSet-Rear
		texture = _MainTex, KerbalFoundriesExpansion/Assets/ALG-Large-DIFF
		texture = _BumpMap, KerbalFoundriesExpansion/Assets/Bump
		texture = _MetallicGlossMap, KerbalFoundriesExpansion/Assets/ALG-Large-EMIS
		texture = _AOMap, KerbalFoundriesExpansion/Assets/Occ
	}
}

+KSP_TEXTURE_SET[MWNN_Stock_Paint]:NEEDS[TexturesUnlimited&KerbalFoundriesExpansion&TURD]:AFTER[TURD]
{
	@name = KFE-ALG-Large-Hardware-Paint
	@MATERIAL,0
	{
		excludeMesh = ALG-Large-WheelSet-Front
		excludeMesh = ALG-Large-WheelSet-Middle
		excludeMesh = ALG-Large-WheelSet-Rear
		vector = _DiffuseNorm,0.74,0.74,0.64
		vector = _MetalNorm,0.5,0.5,0.28
		vector = _SmoothnessNorm,0.5,0.5,0.28
		texture = _MainTex, KerbalFoundriesExpansion/Assets/ALG-Large-DIFF
		texture = _Emissive, KerbalFoundriesExpansion/Assets/ALG-Large-EMIS
		texture = _BumpMap, KerbalFoundriesExpansion/Assets/Bump
		texture = _MetallicGlossMap, KerbalFoundriesExpansion/Assets/ALG-Large-EMIS
		texture = _AOMap, KerbalFoundriesExpansion/Assets/Occ
		texture = _MaskTex, TURD/TU_ALG_Recolour/ALG-Large-MASK
	}
}

KSP_TEXTURE_SET:NEEDS[TexturesUnlimited&KerbalFoundriesExpansion&TURD]
{
	name = KFE-ALG-Large-Wheels-GreyScale
	title = Stock Rubber
	MATERIAL
	{
		mode = create
		shader = KSP/Specular
		mesh = ALG-Large-WheelSet-Front
		mesh = ALG-Large-WheelSet-Middle
		mesh = ALG-Large-WheelSet-Rear
		texture = _MainTex, KerbalFoundriesExpansion/Assets/ALG-Large-DIFF
		PROPERTY
		{
			name = _SpecColor
			color = 0, 0, 0, 1
		}
		PROPERTY
		{
			name = _Shininess
			float = 0.03
		}
	}
}

+KSP_TEXTURE_SET[MWNN_Stock_Paint]:NEEDS[TexturesUnlimited&KerbalFoundriesExpansion&TURD]:AFTER[TURD]
{
	@name = KFE-ALG-Large-Wheels-Paint
	@MATERIAL,0
	{
		mesh = ALG-Large-WheelSet-Front
		mesh = ALG-Large-WheelSet-Middle
		mesh = ALG-Large-WheelSet-Rear
		vector = _DiffuseNorm,0.74,0.74,0.64
		vector = _MetalNorm,0.5,0.5,0.28
		vector = _SmoothnessNorm,0.5,0.5,0.28
		texture = _MainTex, KerbalFoundriesExpansion/Assets/ALG-Large-DIFF
		texture = _Emissive, KerbalFoundriesExpansion/Assets/ALG-Large-EMIS
		texture = _BumpMap, KerbalFoundriesExpansion/Assets/Bump
		texture = _MetallicGlossMap, KerbalFoundriesExpansion/Assets/ALG-Large-EMIS
		texture = _AOMap, KerbalFoundriesExpansion/Assets/Occ
		texture = _MaskTex, TURD/TU_ALG_Recolour/ALG-Large-MASK
	}
}

@PART[KF-ALG-LargeSide|KF-ALG-ExtraLargeSide|KF-ALG-ExtraLarge|KF-ALG-LargeNH|KF-ALG-LargeSingleNH|KF-ALG-LargeSingleSideNH|KF-ALG-LargeSideNH|KF-ALG-ExtraLargeNH|KF-ALG-ExtraLargeSideNH]:NEEDS[TexturesUnlimited&KerbalFoundriesExpansion&TURD]:AFTER[TURD]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Hardware
		currentTextureSet = KFE-ALG-Large-Hardware-GreyScale
		textureSet = TURD-ALG-Large-Hardware-PBR
		textureSet = TURD-ALG-Large-Hardware-Legacy
		textureSet = KFE-ALG-Large-Hardware-GreyScale
		textureSet = KFE-ALG-Large-Hardware-Paint
	}
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Wheels
		currentTextureSet = KFE-ALG-Large-Wheels-GreyScale
		textureSet = TURD-ALG-Large-Wheels-PBR
		textureSet = TURD-ALG-Large-Wheels-Legacy
		textureSet = KFE-ALG-Large-Wheels-GreyScale
		textureSet = KFE-ALG-Large-Wheels-Paint
	}
	MODULE
	{
		name = SSTURecolorGUI
	}
}
