@PART[KF-ALG-MediumSide]:FOR[KerbalFoundriesExpansion]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Hardware
		currentTextureSet = KF-GearMedium-PBR
		textureSet = KF-GearMedium-PBR
		textureSet = KF-GearMedium-Legacy
		textureSet = KF-GearMedium-GreyScale
	}
}
KSP_TEXTURE_SET
{
	name = KF-GearMedium-PBR
	title = PBR
	MATERIAL
	{
		shader = TU/Metallic
		excludeMesh = WheelTread
		texture = _MainTex, KerbalFoundries/Assets/KF-GearMedium-DIFF
		texture = _BumpMap, KerbalFoundries/Assets/KF-GearMedium-NRM
		texture = _MetallicGlossMap, KerbalFoundries/Assets/KF-GearMedium-MET
		texture = _AOMap, KerbalFoundries/Assets/KF-GearMedium-MET
	}
}
KSP_TEXTURE_SET
{
	name = KF-GearMedium-Legacy
	title = Legacy
	MATERIAL
	{
		shader = TU/Legacy
		excludeMesh = WheelTread
		texture = _MainTex, KerbalFoundries/Assets/KF-GearMedium-DIFF
		texture = _BumpMap, KerbalFoundries/Assets/KF-GearMedium-NRM
		texture = _SpecularGlossMap, KerbalFoundries/Assets/KF-GearMedium-MET
		texture = _AOMap, KerbalFoundries/Assets/KF-GearMedium-MET
	}
}
KSP_TEXTURE_SET
{
	name = KF-GearMedium-GreyScale
	title = GreyScale
	MATERIAL
	{
		shader = TU/Metallic
		excludeMesh = WheelTread
		texture = _MainTex, KerbalFoundries/Assets/ALG-Small-DIFF
		texture = _BumpMap, KerbalFoundriesExpansion/Assets/Bump
		texture = _MetallicGlossMap, KerbalFoundriesExpansion/Assets/ALG-Small-EMIS
		texture = _AOMap, KerbalFoundriesExpansion/Assets/Occ
	}
}
@PART[KF-ALG-MediumSide]:FOR[KerbalFoundriesExpansion]
{
	@MODULE[KSPTextureSwitch],0
	{
		textureSet = ALG-SmallNH-Paint
		textureSet = ALG-SmallNH-Paint2
	}
	%MODULE[SSTURecolorGUI]
	{
		%name = SSTURecolorGUI
	}
}
+KSP_TEXTURE_SET[MWNN_Stock_Paint]
{
	@name = ALG-SmallNH-Paint
	@MATERIAL
	{	
		vector = _DiffuseNorm,0.74,0.74,0.64
		vector = _MetalNorm,0.5,0.5,0.28
		vector = _SmoothnessNorm,0.5,0.5,0.28
	
		texture = _MainTex, KerbalFoundries/Assets/ALG-Small-DIFF
		texture = _Emissive, TURD/TU_ALG_Recolour/ALG-Small-EMIS
		texture = _BumpMap, TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _MetallicGlossMap, TURD/TU_ALG_Recolour/ALG-Small-EMIS
		texture = _AOMap, KerbalFoundries/Assets/KF-GearMedium-MET
		texture = _MaskTex, TURD/TU_ALG_Recolour/ALG-SmallNH-MASK
	}
}
+KSP_TEXTURE_SET[MWNN_Stock_Paint]
{
	@name = ALG-SmallNH-Paint2
	@MATERIAL
	{	
		vector = _DiffuseNorm,0.74,0.74,0.64
		vector = _MetalNorm,0.5,0.5,0.28
		vector = _SmoothnessNorm,0.5,0.5,0.28
	
		texture = _MainTex, KerbalFoundries/Assets/ALG-Small-DIFF
		texture = _Emissive, TURD/TU_ALG_Recolour/ALG-Small-EMIS
		texture = _BumpMap, TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _MetallicGlossMap, TURD/TU_ALG_Recolour/ALG-Small-EMIS
		texture = _AOMap, KerbalFoundries/Assets/KF-GearMedium-MET
		texture = _MaskTex, TURD/TU_ALG_Recolour/ALG-SmallNH-MASK2
	}
}