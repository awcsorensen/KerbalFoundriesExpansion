    }
	CONSTRAINT
	{
		mover = ALG-Medium-Suspension
		target = ALG-Medium-SuspensionTarget
		type = POSITION
	}
	CONSTRAINT
    {
        mover = ALG-Medium-Extension
        target = ALG-Medium-ExtendTarget
        type = ROTATION
    }
	CONSTRAINT
	{
		mover = ALG-Medium-Suspension
