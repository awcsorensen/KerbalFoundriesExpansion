		mainAxis = 0,0,1
		secAxis = 1,0,0
	}
	CONSTRAINT
	{
		mover = ALG-Medium-TrailingLowerPivot
		target = ALG-TrailingLinkTarget
		type = LOOKLOCK
		mainAxis = 0,0,1
		secAxis = 1,0,0
	}
	CONSTRAINT
	{
		mover = ALG-Medium-TrailingLowerShaft
