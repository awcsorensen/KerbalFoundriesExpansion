title = ALG Medium - Trailing NH
manufacturer = AW4CS Foundries
description = A housing-less adjustable landing gear with two wheels on a trailing link, Eastern Kerbopean engineers approved of the design. Intended for those who just want the parts without the box (some assembly required)

